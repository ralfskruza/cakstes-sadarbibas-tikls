<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amatpersonu atalgojums</title>
  <!-- PapaParse ātrai un drošai CSV parsēšanai -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --color-gold: #f5b700;
      --color-gold-hover: #ffd043;
      --color-row-hover: rgba(245, 183, 0, 0.08);
      --font-family: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: transparent !important;
      font-family: var(--font-family);
      color: var(--color-gold);
      margin: 0;
      padding: 6px 12px;
      line-height: 1.5;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .table-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      border-top: 2px solid var(--color-gold);
      padding-top: 10px;
    }

    .salary-table {
      width: 100%;
      border-collapse: collapse;
      border: none;
    }

    .salary-table tbody tr {
      transition: background-color 0.15s ease;
    }

    .salary-table tbody tr:hover {
      background-color: var(--color-row-hover);
    }

    .salary-table td {
      padding: 10px 12px;
      vertical-align: middle;
      font-size: 1.05rem;
      color: var(--color-gold);
      border: none;
    }

    .col-position {
      text-align: left;
      font-weight: 500;
      width: 45%;
    }

    .col-name {
      text-align: left;
      font-weight: 500;
      width: 35%;
    }

    .col-salary {
      text-align: right;
      font-weight: 600;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      width: 20%;
    }

    /* Pielāgojumi mazākiem ekrāniem / viedtālruņiem */
    @media (max-width: 640px) {
      body {
        padding: 8px 10px;
      }
      .salary-table td {
        padding: 8px 6px;
        font-size: 0.92rem;
      }
      .col-position {
        width: 40%;
      }
      .col-name {
        width: 35%;
      }
      .col-salary {
        width: 25%;
      }
    }

    @media (max-width: 420px) {
      .salary-table td {
        font-size: 0.85rem;
        padding: 6px 4px;
      }
    }
  </style>
</head>
<body>

  <div class="table-container">
    <table class="salary-table">
      <tbody id="salary-rows">
        <!-- Dati tiks ielādēti dinamiski -->
      </tbody>
    </table>
  </div>

  <script>
    // Google Sheets publicētā CSV saite
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVxheZ723PTu4hQ0appbIlnTNu_uUnCET2u_TSl_kZnNp5SCyjsEqaq3_vur1mgQVJI5zhy-JD-WoT/pub?gid=972459896&single=true&output=csv";

    // Rezerves dati (ja Google Sheets nav pieejams)
    const FALLBACK_DATA = [
      { position: "Direktore", name: "Laura Katkeviča", salary: "2797 EUR" },
      { position: "Direktores vietniece", name: "Ilona Leitāne", salary: "2517 EUR" },
      { position: "Direktores vietniece", name: "Rita Zauka", salary: "2517 EUR" },
      { position: "Direktores vietniece", name: "Selga Veita", salary: "2517 EUR" },
      { position: "Direktores vietnieks", name: "Ainārs Dambergs", salary: "2517 EUR" },
      { position: "Direktores vietniece", name: "Kintija Sila", salary: "1258 EUR" }
    ];

    /**
     * Formatē summas vērtību ar EUR pieaudzējumu
     */
    function formatSalary(raw) {
      if (!raw) return "";
      let str = String(raw).trim();
      if (str.toUpperCase().includes("EUR")) return str;

      // Pārbaudām, vai ir skaitlis
      let cleanNum = str.replace(/\s/g, '').replace(',', '.');
      let num = parseFloat(cleanNum);
      if (!isNaN(num)) {
        return num + " EUR";
      }
      return str + " EUR";
    }

    /**
     * Attēlo rindu masīvu tabulā
     */
    function renderRows(items) {
      const tbody = document.getElementById("salary-rows");
      tbody.innerHTML = "";

      items.forEach(item => {
        const tr = document.createElement("tr");

        const tdPos = document.createElement("td");
        tdPos.className = "col-position";
        tdPos.textContent = item.position;

        const tdName = document.createElement("td");
        tdName.className = "col-name";
        tdName.textContent = item.name;

        const tdSal = document.createElement("td");
        tdSal.className = "col-salary";
        tdSal.textContent = formatSalary(item.salary);

        tr.appendChild(tdPos);
        tr.appendChild(tdName);
        tr.appendChild(tdSal);

        tbody.appendChild(tr);
      });

      // Paziņo vecāka lapai (ja ievietots ar iframe) par precīzo augstumu
      setTimeout(notifyHeight, 50);
    }

    function notifyHeight() {
      try {
        const height = Math.ceil(document.documentElement.scrollHeight || document.body.scrollHeight || 300);
        window.parent.postMessage({ type: 'cakstes-atalgojums-height', height: height }, '*');
      } catch (e) {}
    }

    /**
     * Atpazīst un atlasa tikai faktiskās darbinieku datu rindas no CSV
     */
    function extractEmployeeRows(rows) {
      const result = [];

      for (let r = 0; r < rows.length; r++) {
        const row = rows[r];
        if (!row || row.length === 0) continue;

        // Attīrām šūnas no liekajām atstarpēm
        const clean = row.map(c => String(c || '').trim()).filter(c => c !== "");
        if (clean.length === 0) continue;

        const firstCell = clean[0].toLowerCase();
        const fullRowText = clean.join(" ").toLowerCase();

        // Izlaižam virsrakstus, periodus, likuma atsauces un kolonnu galvenes
        if (
          firstCell.includes("saskaņā") ||
          firstCell.includes("likum") ||
          firstCell.includes("mēnesis") ||
          firstCell.includes("gads") ||
          fullRowText.includes("n.p.k") ||
          fullRowText.includes("amata nosaukums") ||
          fullRowText.includes("aprēķinātais")
        ) {
          continue;
        }

        // Ja 1. šūna ir kārtas skaitlis (N.p.k.), dati ir pārējās šūnās
        let position = "";
        let name = "";
        let salary = "";

        if (!isNaN(parseInt(clean[0], 10)) && clean.length >= 4) {
          // [N.p.k., Amats, Vārds, Atalgojums]
          position = clean[1];
          name = clean[2];
          salary = clean[3];
        } else if (clean.length >= 3) {
          // [Amats, Vārds, Atalgojums]
          position = clean[0];
          name = clean[1];
          salary = clean[2];
        } else if (clean.length === 2) {
          // [Amats / Vārds, Atalgojums]
          position = clean[0];
          salary = clean[1];
        }

        if (position || name || salary) {
          result.push({ position, name, salary });
        }
      }

      return result;
    }

    /**
     * Ielādē jaunākos datus no Google Sheets
     */
    async function loadData() {
      const freshUrl = CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "_cacheBust=" + Date.now();

      try {
        const res = await fetch(freshUrl);
        if (!res.ok) throw new Error("Nevarēja saņemt CSV: " + res.status);

        const csvText = await res.text();
        if (!csvText || csvText.trim().length === 0) {
          throw new Error("CSV ir tukšs");
        }

        const parsed = Papa.parse(csvText, { skipEmptyLines: true });
        const employees = extractEmployeeRows(parsed.data);

        if (employees.length > 0) {
          renderRows(employees);
        } else {
          renderRows(FALLBACK_DATA);
        }
      } catch (err) {
        console.warn("Ielāde no Google Sheets neizdevās, rādām rezerves datus:", err);
        renderRows(FALLBACK_DATA);
      }
    }

    document.addEventListener("DOMContentLoaded", loadData);
  </script>
</body>
</html>
